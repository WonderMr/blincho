name: Validate app and website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node site/build.mjs

  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  tauri-native:
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    name: Check Tauri ${{ matrix.os }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, architecture: arm64, rust-target: aarch64-apple-darwin }
          - { os: macos-15-intel, architecture: x64, rust-target: x86_64-apple-darwin }
          - { os: windows-11-arm, architecture: arm64, rust-target: aarch64-pc-windows-msvc }
          - { os: windows-2022, architecture: x64, rust-target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04-arm, architecture: arm64, rust-target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-24.04, architecture: x64, rust-target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential clang curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11 openbox
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --target ${{ matrix.rust-target }}
          rustup override set 1.92.0
      - name: Cache native Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: blincho-rust-${{ runner.os }}-${{ matrix.rust-target }}-1.92-cmake3.31-macos14-${{ hashFiles('src-tauri/Cargo.lock', '.cargo/config.toml') }}
      - name: Install pinned CMake for native history migration
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m venv "$RUNNER_TEMP/blincho-build-tools"
            build_python="$RUNNER_TEMP/blincho-build-tools/Scripts/python.exe"
          else
            python3 -m venv "$RUNNER_TEMP/blincho-build-tools"
            build_python="$RUNNER_TEMP/blincho-build-tools/bin/python"
          fi
          "$build_python" -m pip install --disable-pip-version-check --no-input cmake==3.31.10
          "$build_python" -c 'import cmake; from pathlib import Path; print(Path(cmake.__file__).parent / "data" / "bin")' >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check locked Tauri sources
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.rust-target }}
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.rust-target }}
      - name: Build native smoke executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.rust-target }}
      - name: Smoke test native renderer, history and timer
        if: runner.os != 'Linux'
        run: node tests/tauri-cross-platform-smoke.cjs
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
      - name: Smoke test Linux renderer, history and timer
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash -c 'openbox >/tmp/blincho-openbox.log 2>&1 & node tests/tauri-cross-platform-smoke.cjs'
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
