name: Release desktop packages and website

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'vX.Y.Z to release or retry. New tags require this workflow to run on main.'
        required: true
        type: string

permissions:
  contents: read

# Serialize publication and deployments. A failed or older release cannot race a newer site.
concurrency:
  group: blincho-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # A tag created with GITHUB_TOKEN does not trigger another push workflow.
      # Resolve its commit here and release it in this same invocation.
      - name: Resolve existing tag or safely create the current version on main
        id: tag
        run: node scripts/prepare-release-tag.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/release-check.mjs
      - run: npm ci
      - name: Repair Windows test import for immutable v1.4.2 retry
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == 'v1.4.2'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "c77cca3653171ecf84818039ca95913573709b9e"
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/update-feed.test.cjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = "'--import', path.join(directory, 'mock-github.mjs'),";
          const after = "'--import', require('node:url').pathToFileURL(path.join(directory, 'mock-github.mjs')).href,";
          if (source.split(before).length !== 2) throw new Error('Expected exactly one v1.4.2 fixture import');
          fs.writeFileSync(file, source.replace(before, after));
          NODE
      - run: npm test
      - run: npm run build

  package:
    needs: validate
    name: Package ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos, architecture: arm64, rust-target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos, architecture: x64, rust-target: x86_64-apple-darwin }
          - { os: windows-11-arm, platform: windows, architecture: arm64 }
          - { os: windows-2022, platform: windows, architecture: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, architecture: arm64 }
          - { os: ubuntu-24.04, platform: linux, architecture: x64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - name: Validate tag and lockfile
        run: node scripts/release-check.mjs
      - name: Install pinned Rust toolchain for Tauri macOS
        if: matrix.platform == 'macos' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --target ${{ matrix.rust-target }}
          rustup override set 1.92.0
      - name: Install pinned CMake for native history migration
        if: matrix.platform == 'macos' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/blincho-build-tools"
          "$RUNNER_TEMP/blincho-build-tools/bin/python" -m pip install --disable-pip-version-check --no-input cmake==3.31.10
          "$RUNNER_TEMP/blincho-build-tools/bin/python" -c 'import cmake; from pathlib import Path; print(Path(cmake.__file__).parent / "data" / "bin")' >> "$GITHUB_PATH"
      - run: npm ci
      - name: Repair Windows test import for immutable v1.4.2 retry
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == 'v1.4.2'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "c77cca3653171ecf84818039ca95913573709b9e"
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/update-feed.test.cjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = "'--import', path.join(directory, 'mock-github.mjs'),";
          const after = "'--import', require('node:url').pathToFileURL(path.join(directory, 'mock-github.mjs')).href,";
          if (source.split(before).length !== 2) throw new Error('Expected exactly one v1.4.2 fixture import');
          fs.writeFileSync(file, source.replace(before, after));
          NODE
      - run: npm test
      - run: npm run build
      - name: Check Rust formatting
        if: matrix.platform == 'macos' && hashFiles('src-tauri/Cargo.toml') != ''
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run locked Rust checks and tests
        if: matrix.platform == 'macos' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native packages
        run: node scripts/release-package.mjs ${{ matrix.platform }} ${{ matrix.architecture }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ needs.validate.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-upload
      - name: Require every platform artifact and hash the exact bytes
        run: node scripts/release-checksums.mjs
      - name: Upload draft, verify packages and update receipts, then publish beta
        run: node scripts/release-publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Generate verified release history from published GitHub assets
        id: manifest
        run: node scripts/release-manifest.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install dependencies
        if: steps.manifest.outputs.deploy == 'true'
        run: npm ci
      - name: Build browser app and localized website
        if: steps.manifest.outputs.deploy == 'true'
        run: |
          npm run build
          node site/build.mjs
      - name: Validate Worker bundle
        if: steps.manifest.outputs.deploy == 'true'
        run: npx --yes wrangler@4.149.0 deploy --dry-run
      - name: Deploy site and manifest together
        if: steps.manifest.outputs.deploy == 'true'
        run: |
          node -e "for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']) if (!process.env[name]) throw new Error(name + ' secret is missing')"
          npx --yes wrangler@4.149.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
