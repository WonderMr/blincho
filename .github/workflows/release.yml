name: Release desktop packages and website

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'vX.Y.Z to release or retry. New tags require this workflow to run on main.'
        required: true
        type: string

permissions:
  contents: read

# Serialize publication and deployments. A failed or older release cannot race a newer site.
concurrency:
  group: blincho-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # A tag created with GITHUB_TOKEN does not trigger another push workflow.
      # Resolve its commit here and release it in this same invocation.
      - name: Resolve existing tag or safely create the current version on main
        id: tag
        run: node scripts/prepare-release-tag.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/release-check.mjs
      - run: npm ci
      - name: Repair Windows test import for immutable v1.4.2 retry
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == 'v1.4.2'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "c77cca3653171ecf84818039ca95913573709b9e"
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/update-feed.test.cjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = "'--import', path.join(directory, 'mock-github.mjs'),";
          const after = "'--import', require('node:url').pathToFileURL(path.join(directory, 'mock-github.mjs')).href,";
          if (source.split(before).length !== 2) throw new Error('Expected exactly one v1.4.2 fixture import');
          fs.writeFileSync(file, source.replace(before, after));
          NODE
      - run: npm test
      - run: npm run build

  package:
    needs: validate
    name: Package ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos, architecture: arm64, rust-target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos, architecture: x64, rust-target: x86_64-apple-darwin }
          - { os: windows-11-arm, platform: windows, architecture: arm64, rust-target: aarch64-pc-windows-msvc }
          - { os: windows-2022, platform: windows, architecture: x64, rust-target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04-arm, platform: linux, architecture: arm64, rust-target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-24.04, platform: linux, architecture: x64, rust-target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - name: Validate tag and lockfile
        run: node scripts/release-check.mjs
      - name: Select runtime from immutable release version
        id: runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const parts = JSON.parse(fs.readFileSync('package.json', 'utf8')).version.split('.').map(Number);
          const atLeast = minor => parts[0] > 1 || (parts[0] === 1 && parts[1] >= minor);
          const tauri = fs.existsSync('src-tauri/Cargo.toml') && (atLeast(6) || ('${{ matrix.platform }}' === 'macos' && atLeast(5)));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tauri=${tauri}\n`);
          NODE
      - name: Install Linux native build and bundle dependencies
        if: matrix.platform == 'linux' && steps.runtime.outputs.tauri == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf xdg-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good xvfb dbus-x11 openbox
      - name: Verify Windows native compiler and package extractor
        if: matrix.platform == 'windows' && steps.runtime.outputs.tauri == 'true'
        shell: pwsh
        run: |
          $component = if ('${{ matrix.architecture }}' -eq 'arm64') { 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires $component -property installationPath
          if (-not $vs) { throw "Required native Visual Studio C++ tools are missing" }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) { throw "7-Zip is required for installer verification" }
      - name: Install pinned native Rust toolchain
        if: steps.runtime.outputs.tauri == 'true'
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --target ${{ matrix.rust-target }}
          rustup override set 1.92.0
      - name: Install pinned CMake for native history migration
        shell: bash
        if: steps.runtime.outputs.tauri == 'true'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m venv "$RUNNER_TEMP/blincho-build-tools"
            build_python="$RUNNER_TEMP/blincho-build-tools/Scripts/python.exe"
          else
            python3 -m venv "$RUNNER_TEMP/blincho-build-tools"
            build_python="$RUNNER_TEMP/blincho-build-tools/bin/python"
          fi
          "$build_python" -m pip install --disable-pip-version-check --no-input cmake==3.31.10
          "$build_python" -c 'import cmake; from pathlib import Path; print(Path(cmake.__file__).parent / "data" / "bin")' >> "$GITHUB_PATH"
      - run: npm ci
      - name: Repair Windows test import for immutable v1.4.2 retry
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == 'v1.4.2'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "c77cca3653171ecf84818039ca95913573709b9e"
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/update-feed.test.cjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = "'--import', path.join(directory, 'mock-github.mjs'),";
          const after = "'--import', require('node:url').pathToFileURL(path.join(directory, 'mock-github.mjs')).href,";
          if (source.split(before).length !== 2) throw new Error('Expected exactly one v1.4.2 fixture import');
          fs.writeFileSync(file, source.replace(before, after));
          NODE
      - run: npm test
      - run: npm run build
      - name: Check Rust formatting
        if: steps.runtime.outputs.tauri == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run locked Rust checks and tests
        if: steps.runtime.outputs.tauri == 'true'
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.rust-target }}
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.rust-target }}
      - name: Build native smoke executable
        if: steps.runtime.outputs.tauri == 'true' && hashFiles('tests/tauri-cross-platform-smoke.cjs') != ''
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.rust-target }}
      - name: Smoke test native renderer, history and timer
        if: matrix.platform != 'linux' && steps.runtime.outputs.tauri == 'true' && hashFiles('tests/tauri-cross-platform-smoke.cjs') != ''
        run: node tests/tauri-cross-platform-smoke.cjs
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
      - name: Smoke test Linux renderer, history and timer
        if: matrix.platform == 'linux' && steps.runtime.outputs.tauri == 'true' && hashFiles('tests/tauri-cross-platform-smoke.cjs') != ''
        run: xvfb-run -a dbus-run-session -- bash -c 'openbox >/tmp/blincho-openbox.log 2>&1 & node tests/tauri-cross-platform-smoke.cjs'
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
      - name: Build native packages
        run: node scripts/release-package.mjs ${{ matrix.platform }} ${{ matrix.architecture }}
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ needs.validate.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-upload
      - name: Require every platform artifact and hash the exact bytes
        run: node scripts/release-checksums.mjs
      - name: Upload draft, verify packages and update receipts, then publish beta
        run: node scripts/release-publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Generate verified release history from published GitHub assets
        id: manifest
        run: node scripts/release-manifest.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install dependencies
        if: steps.manifest.outputs.deploy == 'true'
        run: npm ci
      - name: Build browser app and localized website
        if: steps.manifest.outputs.deploy == 'true'
        run: |
          npm run build
          node site/build.mjs
      - name: Validate Worker bundle
        if: steps.manifest.outputs.deploy == 'true'
        run: npx --yes wrangler@4.149.0 deploy --dry-run
      - name: Deploy site and manifest together
        if: steps.manifest.outputs.deploy == 'true'
        run: |
          node -e "for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']) if (!process.env[name]) throw new Error(name + ' secret is missing')"
          npx --yes wrangler@4.149.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
