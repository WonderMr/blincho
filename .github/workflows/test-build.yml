name: Build isolated test apps

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-package:
    name: Blincho Test ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos, architecture: arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos, architecture: x64, target: x86_64-apple-darwin }
          - { os: windows-2022, platform: windows, architecture: x64, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, platform: linux, architecture: x64, target: x86_64-unknown-linux-gnu }
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential clang curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf xdg-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good xvfb dbus-x11 openbox
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --target ${{ matrix.target }}
          rustup override set 1.92.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            release/test-target
          key: blincho-test-${{ runner.os }}-${{ matrix.target }}-rust1.92-cmake3.31-${{ hashFiles('src-tauri/Cargo.lock', '.cargo/config.toml', '.cargo/*.cmake') }}
      - name: Install pinned CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m venv "$RUNNER_TEMP/blincho-test-build-tools"
            build_python="$RUNNER_TEMP/blincho-test-build-tools/Scripts/python.exe"
          else
            python3 -m venv "$RUNNER_TEMP/blincho-test-build-tools"
            build_python="$RUNNER_TEMP/blincho-test-build-tools/bin/python"
          fi
          "$build_python" -m pip install --disable-pip-version-check --no-input cmake==3.31.10
          "$build_python" -c 'import cmake; from pathlib import Path; print(Path(cmake.__file__).parent / "data" / "bin")' >> "$GITHUB_PATH"
      - run: npm ci
      - name: Build portable isolated app
        run: npm run tauri:build:test -- ${{ matrix.target }}
      - name: Prepare Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-desktop.ps1 -RestartExplorerOnce -TimeoutSeconds 20
      - name: Verify actual test identity and separate profile
        if: runner.os != 'Linux'
        run: node tests/tauri-test-channel-smoke.cjs
      - name: Verify Linux test identity and separate profile
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash -c 'openbox >/tmp/blincho-test-openbox.log 2>&1 & node tests/tauri-test-channel-smoke.cjs'
      - name: Retain test downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blincho-Test-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release/test-artifacts/*
          if-no-files-found: error
          retention-days: 14
